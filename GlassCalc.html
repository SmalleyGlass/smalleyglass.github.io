<script>
  document.addEventListener("DOMContentLoaded", function() {
    // The "Magic Word" to look for
    const magicWord = "[[CALCULATOR]]";
    
    // The Calculator HTML to swap in
    const calculatorHTML = `
      <iframe 
        src="https://resilient-klepon-ef39b4.netlify.app/" 
        style="width: 100%; height: 900px; border: none; overflow: hidden;" 
        title="Smalley Glass Cost Estimator">
      </iframe>
    `;

    // Find all text blocks and swap the magic word
    const allElements = document.getElementsByTagName('*');
    for (let i = 0; i < allElements.length; i++) {
      // Check if the element contains ONLY our magic word (trimmed of whitespace)
      if (allElements[i].innerText && allElements[i].innerText.trim() === magicWord) {
        allElements[i].innerHTML = calculatorHTML;
      }
    }
  });
</script>
